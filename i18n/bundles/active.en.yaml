# ToolSchema i18n bundle — active English (en) locale.
#
# Every entry maps a CONST-046-migrated hardcoded literal in
# digital.vasic.toolschema to a message ID resolved at runtime via
# Translator.T. The consuming project wires a real Translator at
# boot; the in-package NoopTranslator echoes the message ID verbatim
# for unit tests + backward compat.
#
# Naming convention: toolschema_<area>_<short_description>.
# All IDs prefixed with toolschema_ to avoid namespace collision
# with other packages' bundles when loaded into the same go-i18n
# Bundle.
#
# Round-322 §11.4 anti-bluff sweep (2026-05-20): migrated 22 of the
# most user-facing runtime literals in handler.go — 11 error
# messages surfaced in ToolResult.Error (unknown tool, invalid file
# path, invalid git operation, invalid working directory, dangerous
# characters, invalid git reference, invalid path, invalid symbol,
# unsupported linter) and 11 operation-description strings emitted
# by the GenerateDefaultArgs paths of GitHandler / RunTestsHandler /
# RunLintHandler (the human-readable text an agent sees in proposed
# tool arguments). Static var-init literals in the
# ToolSchemaRegistry (schema.go) are JSON-schema-adjacent
# descriptions deferred to a future round to stay under the size
# cap.

toolschema_err_unknown_tool:
  other: "unknown tool: {{.Tool}}"
toolschema_err_invalid_file_path:
  other: "invalid file path: {{.Path}}"
toolschema_err_invalid_path:
  other: "invalid path: {{.Path}}"
toolschema_err_invalid_git_operation:
  other: "invalid git operation: {{.Operation}}"
toolschema_err_invalid_working_dir:
  other: "invalid working directory path: {{.Path}}"
toolschema_err_dangerous_arg:
