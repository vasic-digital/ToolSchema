# Round-285 5-locale CONST-046 fixture for the digital.vasic.toolschema
# Challenge runner. The runner does NOT load this file at run time —
# the locale lines are encoded in supportedLocales() in
# challenges/runner/main.go so the binary stays self-contained. This
# YAML is the human-readable source of truth that the runner's locale
# functions are derived from; whenever a locale line changes in the
# runner, this file MUST be updated in the SAME commit to keep the two
# in sync. Drift is a CONST-046 violation.
#
# Schema:
#   locales:
#     - tag: <BCP-47-ish short tag the runner prints inside [tag]>
#       template: <human-readable summary line with %d schemaCount %d handlerCount placeholders>
#       canonical_token: <substring the runner asserts is present>

locales:
  - tag: en
    template: "toolschema: %d schemas registered, %d default handlers exercised"
    canonical_token: "toolschema:"
  - tag: sr
    template: "toolschema: %d šema registrovano, %d podrazumevanih obrađivača izvršeno"
    canonical_token: "toolschema:"
  - tag: ja
    template: "toolschema: %d スキーマ登録、%d デフォルトハンドラを実行"
    canonical_token: "toolschema:"
  - tag: es
    template: "toolschema: %d esquemas registrados, %d handlers ejercidos"
    canonical_token: "toolschema:"
  - tag: de
    template: "toolschema: %d Schemata registriert, %d Standard-Handler ausgeübt"
    canonical_token: "toolschema:"
